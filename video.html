<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="concept-page animation-page">
    <main class="page-shell concept-shell">
        <header class="page-header">
            <a href="index.html" class="brand" aria-label="Go to homepage">MUKAI</a>
            <nav class="page-nav" aria-label="Main navigation">
                <a href="concept.html" class="nav-item">
                    <span class="nav-en">CONCEPT</span>
                    <span class="nav-jp">コンセプト</span>
                </a>
                <a href="video.html" class="nav-item is-active">
                    <span class="nav-en">ANIMATION</span>
                    <span class="nav-jp">アニメーション</span>
                </a>
            </nav>
        </header>

        <section class="title-block">
            <div class="title-wrap">
                <h1>ANIMATION</h1>
                <div class="subtitle-jp">アニメーション</div>
            </div>
        </section>

        <section class="video-panel" id="gallery"></section>
    </main>

    <div id="modal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <video class="modal-content" id="modal-video" controls onclick="closeModal()">
            Ваш браузер не поддерживает видео.
        </video>
    </div>

    <script>
        function getYouTubeId(url) {
            const match = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
            return match ? match[1] : null;
        }

        fetch("data/animation.json?v=" + Date.now(), { cache: "no-store" })
            .then(res => res.json())
            .then(data => {
                const gallery = document.querySelector(".video-panel");
                gallery.innerHTML = data.items
                    .map(item => typeof item === "string" ? item : item.src)
                    .filter(src => src)
                    .map(src => {
                        const youtubeId = getYouTubeId(src);
                        if (youtubeId) {
                            return `
                                <iframe class="video-frame" src="https://www.youtube.com/embed/${youtubeId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                            `;
                        }
                        return `
                            <video class="video-frame" controls preload="auto" muted loop autoplay onclick="openModal(this)">
                                <source src="${src}" type="video/mp4">
                                Ваш браузер не поддерживает видео.
                            </video>
                        `;
                    })
                    .join("");
            });

        function openModal(videoElement) {
            const modalVideo = document.getElementById("modal-video");
            modalVideo.src = videoElement.currentSrc || videoElement.src;
            document.getElementById("modal").style.display = "flex";
            modalVideo.play();
        }

        function closeModal() {
            const modalVideo = document.getElementById("modal-video");
            modalVideo.pause();
            modalVideo.currentTime = 0;
            document.getElementById("modal").style.display = "none";
        }

        document.getElementById("modal").addEventListener("click", function (e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
