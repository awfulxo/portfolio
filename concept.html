<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="concept-page">
    <main class="page-shell concept-shell">
        <header class="page-header">
            <a href="index.html" class="brand" aria-label="Go to homepage">MUKAI</a>
            <nav class="page-nav" aria-label="Main navigation">
                <a href="concept.html" class="nav-item is-active">
                    <span class="nav-en">CONCEPT</span>
                    <span class="nav-jp">コンセプト</span>
                </a>
                <a href="video.html" class="nav-item">
                    <span class="nav-en">ANIMATION</span>
                    <span class="nav-jp">アニメーション</span>
                </a>
            </nav>
        </header>

        <section class="title-block">
            <div class="title-wrap">
                <h1>CONCEPT</h1>
                <div class="subtitle-jp">コンセプト</div>
            </div>
        </section>

        <section class="concept-gallery" id="gallery"></section>
    </main>

    <div id="modal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modal-img" onclick="closeModal()">
    </div>

    <script>
        fetch("data/concept.json?v=" + Date.now(), { cache: "no-store" })
            .then(res => res.json())
            .then(data => {
                const gallery = document.getElementById("gallery");
                gallery.innerHTML = data.items
                    .map(item => typeof item === "string" ? item : item.src)
                    .filter(src => src)
                    .map(src => `
                        <article class="work-card">
                            <div class="work-card__image" onclick="openModal('${src}')">
                                <img src="${src}" alt="Concept work">
                                <div class="work-card__overlay">
                                    <span class="overlay-icon">◌</span>
                                </div>
                            </div>
                        </article>
                    `)
                    .join("");
            });

        function openModal(src) {
            document.getElementById("modal").style.display = "flex";
            document.getElementById("modal-img").src = src;
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }

        document.getElementById("modal").addEventListener("click", function (e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
